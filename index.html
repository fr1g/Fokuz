        <title>Fokuz — 图片聚焦工具</title>
        <style>
            /* Static splash: paints with the first frame, before any JS is ready.
         React keeps #root invisible and fades both across on handover. */
            #root {
                opacity: 0;
                transition: opacity 0.45s ease;
            }
            #splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                background: #0a0a0a;
                animation: splash-in 0.4s ease-out backwards;
                transition: opacity 0.45s ease;
            }
            #splash.hide {
                opacity: 0;
                pointer-events: none;
            }
            .splash-icon {
                width: 96px;
                height: 96px;
                border-radius: 18px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
            }
            .splash-name {
                font-family: system-ui;
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 0.05em;
                opacity: 0.8;
            }
            @keyframes splash-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #splash,
                #root {
                    animation: none;
                    transition: none;
                }
            }
        </style>
    </head>
